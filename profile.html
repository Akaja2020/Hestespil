
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesteprofil | Hestespillet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header profile-header">
        <a class="back-link" href="index.html">
            ← Tilbage til hesteoversigten
        </a>

        <p class="eyebrow">HESTEREGISTER</p>
        <h1>Hesteprofil</h1>
        <p class="intro">Hver hest har sin egen identitet.</p>
    </header>

    <main>
        <p id="profileError" class="message" hidden></p>

        <section id="profileContent" hidden>
            <article class="profile-card">
                <div class="profile-top">
                    <p class="eyebrow">HESTENS IDENTITET</p>
                    <span id="profileId" class="id-badge"></span>
                </div>

                <h2 id="profileName" class="profile-name"></h2>
                <p id="profileSubtitle" class="profile-subtitle"></p>

                <div class="detail-grid">
                    <div class="detail-item">
                        <span class="detail-label">Race</span>
                        <span id="profileBreed" class="detail-value"></span>
                    </div>

                    <div class="detail-item">
                        <span class="detail-label">Køn</span>
                        <span id="profileSex" class="detail-value"></span>
                    </div>

                    <div class="detail-item">
                        <span class="detail-label">Alder</span>
                        <span id="profileAge" class="detail-value"></span>
                    </div>

                    <div class="detail-item">
                        <span class="detail-label">Født i spillet</span>
                        <span id="profileBirthDate" class="detail-value"></span>
                    </div>
                </div>

                <div class="profile-actions">
                    <button id="editProfileButton" type="button">
                        Rediger navn
                    </button>
                </div>
            </article>

            <section id="editProfileSection" class="panel" hidden>
                <h2>Rediger hestens navn</h2>

                <label for="editName">Navn</label>
                <input
                    id="editName"
                    type="text"
                    placeholder="Hestens navn"
                >

                <div class="button-row">
                    <button id="saveProfileButton" type="button">
                        Gem navn
                    </button>

                    <button
                        id="cancelProfileEditButton"
                        class="secondary-button"
                        type="button"
                    >
                        Annuller
                    </button>
                </div>
            </section>
        </section>
    </main>

    <script src="profile.js"></script>
</body>
</html>
