<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesteoversigt – Hestespillet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="main-nav" aria-label="Hovedmenu">
    <a class="nav-brand" href="index.html">🐴 Hestespillet</a>
    <details class="nav-menu">
        <summary aria-label="Åbn hovedmenu">☰ Menu</summary>
        <div class="nav-links"><a class="nav-link" href="index.html">Forside</a><a class="nav-link" href="player.html">Spillerprofil</a><a class="nav-link active" href="horses.html" aria-current="page">Hesteoversigt</a><a class="nav-link" href="calendar.html">Kalender</a><a class="nav-link" href="economy.html">Økonomi</a></div>
    </details>
</nav>
<section class="game-time-bar" aria-label="Spillets tid">
    <div class="game-time-current">
        <span id="gameYear">År 1</span>
        <strong id="gameMonth">Januar</strong>
        <span id="gameSeason">Vinter</span>
    </div>
    <button id="nextMonthButton" type="button" disabled>Næste måned</button>
    <p id="gameTimeStatus" role="status" aria-live="polite">Spillets tid indlæses …</p>
</section>
    <main class="page-container">
        <section class="panel">
            <p class="eyebrow">DIN STALD</p>
            <h1>Hesteoversigt</h1>
            <p>Her kan du se alle hestene i din stald og åbne deres profiler.</p>
            <p id="horseCount">Indlæser heste …</p>
            <div id="horseGrid" class="horse-grid"></div>
            <p id="horseMessage" role="status"></p>
            <a class="button" href="index.html">Tilbage til forsiden</a>
        </section>
    </main>
    <script src="horses.js"></script>
    <script src="game-time.js"></script>
</body>
</html>
